<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travels Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 3rem;
      border: 1px solid #333;
      border-radius: 12px;
      background: #16213e;
    }
    h1 { font-size: 2.5rem; color: #e94560; margin-bottom: 0.5rem; }
    p { color: #a0a0a0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>travels.weirdo.codes is alive 🚀</p>
  </div>
</body>
</html>
